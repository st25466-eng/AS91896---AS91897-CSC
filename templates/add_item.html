<!DOCTYPE html>
<html>
<head>
    <title>Add Unsold Item</title>
</head>
<body>
    <h1>List an Unsold Item</h1>
    <p>Bakeries: Use this form to list your end-of-day items for discount.</p>
    
    <form method="POST">
        <label>Your Bakery Name (Must match exactly how you signed up):</label><br>
        <input type="text" name="bakery_name" required>
        <br><br>
        
        <label>Item Name (e.g., Dozen Croissants):</label><br>
        <input type="text" name="item_name" required>
        <br><br>
        
        <label>Original Price ($):</label><br>
        <input type="number" step="0.01" name="original_price" required>
        <br><br>
        
        <label>Discount Price ($):</label><br>
        <input type="number" step="0.01" name="discount_price" required>
        <br><br>
        
        <button type="submit">List Item</button>
    </form>
